<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flashcards">
<meta name="theme-color" content="#0d0d12">
<link rel="manifest" href="./manifest.json">
<title>Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<script src="https://code.responsivevoice.org/responsivevoice.js?key=FREE"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d0d12;--s:#13131c;--b:#1c1c28;--b2:#22223a;
  --t:#e8e8f2;--m:#7777a0;--mm:#44445a;
  --g:#34d399;--p:#818cf8;--y:#fbbf24;--r:#fb7185;
  --gd:#081a10;--pd:#0d0d22;
}
html,body{height:100%;background:var(--bg);color:var(--t);font-family:'DM Sans',-apple-system,sans-serif;overflow:hidden}
.pg{display:none;flex-direction:column;height:100svh}.pg.on{display:flex}

/* HOME */
.hdr{padding:52px 20px 14px;padding-top:max(52px,calc(env(safe-area-inset-top)+18px));flex-shrink:0}
.logo{font-family:'Instrument Serif',serif;font-size:26px;font-weight:400;letter-spacing:-.3px}
.sub{font-size:12px;color:var(--mm);margin-top:3px}
.pill{display:flex;align-items:center;gap:7px;margin-top:10px;padding:9px 12px;background:var(--s);border:1px solid var(--b);border-radius:10px;font-size:11px;color:var(--m)}
.pill-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;transition:background .3s}
.lngs{display:flex;gap:6px;margin-top:9px}
.lb{padding:6px 15px;border-radius:99px;border:1px solid var(--b);background:var(--s);color:var(--m);font-size:12px;font-family:inherit;cursor:pointer;transition:.15s}
.lb.on{background:var(--gd);color:var(--g);border-color:#1c4a2c;font-weight:600}
.list{flex:1;overflow-y:auto;padding:6px 20px 120px;-webkit-overflow-scrolling:touch}
.sec-h{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mm);margin:16px 0 6px 2px}
.dk{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--s);border:1px solid var(--b);border-radius:11px;margin-bottom:6px;cursor:pointer;transition:background .1s,border-color .1s}
.dk.on{background:var(--gd);border-color:#1c4a2c}
.dk-ico{width:34px;height:34px;background:var(--b2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.dk-info{flex:1;min-width:0}
.dk-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--t)}
.dk.on .dk-name{color:var(--g)}
.dk-cnt{font-size:11px;color:var(--m);margin-top:1px}
.dk-chk{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--b2);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.12s}
.dk.on .dk-chk{background:var(--g);border-color:var(--g)}
.tick{display:none}.dk.on .tick{display:block;width:4px;height:7px;border:1.5px solid #000;border-top:none;border-left:none;transform:rotate(45deg);margin-top:-1px}
.bar{position:fixed;bottom:0;left:0;right:0;padding:10px 16px;padding-bottom:max(14px,calc(env(safe-area-inset-bottom)+10px));background:rgba(13,13,18,.97);border-top:1px solid var(--b);backdrop-filter:blur(20px);display:flex;gap:8px;align-items:center;transform:translateY(100%);transition:transform .2s}
.bar.show{transform:none}
.bar-info{flex:1;font-size:11px;color:var(--m)}.bar-info strong{color:var(--t);font-size:12px}
.btn-ghost{padding:10px 12px;background:var(--s);border:1px solid var(--b);border-radius:9px;color:var(--m);font-size:12px;font-family:inherit;cursor:pointer}
.btn-go{padding:10px 22px;background:var(--g);color:#000;border:none;border-radius:9px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer}

/* PLAYER */
.top{display:flex;align-items:center;padding:10px 16px;padding-top:max(10px,calc(env(safe-area-inset-top)+4px));border-bottom:1px solid var(--b);gap:8px;flex-shrink:0;min-height:50px}
.bk{background:none;border:none;color:var(--m);font-size:13px;cursor:pointer;font-family:inherit;padding:3px 0}
.ptitle{flex:1;text-align:center;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.pctr{font-size:11px;color:var(--m);white-space:nowrap}
.content{flex:1;overflow-y:auto;padding:16px 20px 20px;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column}

/* Rep badge */
.rep{align-self:flex-start;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:99px;margin-bottom:12px}
.r0{background:var(--gd);color:var(--g);border:1px solid #1c4a2c}
.r1{background:var(--pd);color:var(--p);border:1px solid #1c1c44}
.r2{background:#1a1205;color:var(--y);border:1px solid #40300e}
.r3{background:#1a050e;color:var(--r);border:1px solid #40101e}

/* Fields — ALL visible, answer ones dimmed until revealed */
.field{padding:8px 0;border-bottom:1px solid #181826}
.field:last-child{border-bottom:none}
.field.ans{opacity:.2;transition:opacity .35s}
.field.ans.show{opacity:1}
.fl{font-size:8.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mm);margin-bottom:4px;transition:color .15s}
.fl.lit{color:var(--y)}
.fv{font-size:14px;line-height:1.75}
.fv.ctx{color:var(--m);font-size:12.5px;font-style:italic}
.fv.big{font-size:15px;font-weight:600;color:#fff}
.fv.blue{color:var(--p);font-size:13px}
.fv.src{color:var(--mm);font-size:11.5px;font-style:italic}

/* Speaking bar */
.spkbar{padding:9px 16px;background:#080e0a;border-top:1px solid #162012;display:flex;align-items:center;gap:8px;flex-shrink:0;min-height:36px}
.spkdot{width:5px;height:5px;border-radius:50%;background:var(--g);animation:blink 1.2s infinite;flex-shrink:0}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.spktxt{font-size:10.5px;color:var(--g);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Controls */
.ctrl{padding:9px 16px;padding-bottom:max(14px,calc(env(safe-area-inset-bottom)+2px));border-top:1px solid var(--b);display:flex;gap:7px;align-items:center;flex-shrink:0}
.spd-btn{padding:10px 12px;background:var(--s);border:1px solid var(--b);border-radius:9px;color:var(--m);font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;min-width:50px;text-align:center}
.spd-btn.hi{color:var(--y);border-color:#40300e;background:#1a1205}
.main-btn{flex:1;padding:11px;background:#fff;color:#000;border:none;border-radius:9px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer}
.skip-btn{padding:10px 13px;background:var(--s);border:1px solid var(--b);border-radius:9px;color:var(--m);font-size:15px;font-family:inherit;cursor:pointer}
.prow{display:flex;gap:10px;padding:7px 16px;padding-bottom:max(10px,calc(env(safe-area-inset-bottom)+7px));border-top:1px solid #111;flex-shrink:0}
.pslot{display:flex;align-items:center;gap:7px;flex:1}
.plbl{font-size:9px;color:var(--mm);white-space:nowrap;text-transform:uppercase;letter-spacing:.1em;flex-shrink:0}
.pval{font-size:10px;min-width:22px;text-align:right;flex-shrink:0}
.pval.g{color:var(--g)}.pval.p{color:var(--p)}
input[type=range]{flex:1;height:2px;cursor:pointer;border-radius:2px}
#p1r{accent-color:var(--g)}#p2r{accent-color:var(--p)}
@media(min-width:600px){.list,.hdr{max-width:560px;margin:0 auto}.content{max-width:580px;margin:0 auto}}
</style>
</head>
<body>

<!-- HOME -->
<div class="pg on" id="pgHome">
  <div class="hdr">
    <div class="logo">Flashcards</div>
    <div class="sub">Vaelg decks og tryk Afspil</div>
    <div class="pill"><div class="pill-dot" id="pdot" style="background:var(--y)"></div><span id="ptxt">Indlaeder...</span></div>
    <div class="lngs">
      <button class="lb on" id="bDA" onclick="setLang('da')">Dansk</button>
      <button class="lb"    id="bEN" onclick="setLang('en')">English</button>
    </div>
  </div>
  <div class="list" id="deckSec"></div>
  <div class="bar" id="bar">
    <div class="bar-info" id="bInfo"></div>
    <button class="btn-ghost" onclick="clearSel()">Ryd</button>
    <button class="btn-go" id="goBtn" onclick="startPlay()">Afspil</button>
  </div>
</div>

<!-- PLAYER -->
<div class="pg" id="pgPlay">
  <div class="top">
    <button class="bk" onclick="goHome()">&#8592; Decks</button>
    <div class="ptitle" id="ptitle"></div>
    <div class="pctr" id="pctr">0/0</div>
  </div>
  <div class="content" id="pcontent">
    <div id="idleV" style="display:flex;flex:1;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:32px">
      <div style="font-size:40px;opacity:.3">&#9654;</div>
      <div style="font-family:'Instrument Serif',serif;font-size:22px;font-weight:400" id="idleH">Klar til afspilning</div>
      <div style="font-size:11px;color:var(--mm);line-height:1.7;max-width:260px">Hvert kort laeses 4 gange med stigende interval</div>
      <div id="idleChips" style="display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:4px"></div>
    </div>
    <div id="cardV" style="display:none;flex-direction:column">
      <div class="rep r0" id="rBadge">Nyt</div>
      <div class="field" id="fQ"><div class="fl" id="lQ">SPOERGSMAAL</div><div class="fv" id="vQ"></div></div>
      <div class="field" id="fC"><div class="fl" id="lC">KONTEKST</div><div class="fv ctx" id="vC"></div></div>
      <div class="field ans" id="fE"><div class="fl" id="lE">ESSENS</div><div class="fv big" id="vE"></div></div>
      <div class="field ans" id="fR"><div class="fl" id="lR">REFLEKSION</div><div class="fv blue" id="vR"></div></div>
      <div class="field ans" id="fU"><div class="fl" id="lU">UDDYBNING</div><div class="fv" id="vU"></div></div>
      <div class="field ans" id="fS"><div class="fl" id="lS">SVAR</div><div class="fv blue" id="vS"></div></div>
      <div class="field ans" id="fK"><div class="fl" id="lK">KILDE</div><div class="fv src" id="vK"></div></div>
    </div>
  </div>
  <div class="spkbar" id="spkbar" style="display:none">
    <div class="spkdot"></div><div class="spktxt" id="spktxt">...</div>
  </div>
  <div class="ctrl">
    <button class="spd-btn" id="spdBtn" onclick="nextSpd()">1.0x</button>
    <button class="main-btn" id="mainBtn" onclick="togglePlay()">Afspil</button>
    <button class="skip-btn" onclick="doSkip()">&#8250;</button>
  </div>
  <div class="prow">
    <div class="pslot">
      <span class="plbl">Svar</span>
      <input type="range" id="p1r" min="1" max="10" value="3"
             oninput="PAUSE1=+this.value;G('p1v').textContent=this.value+'s'">
      <span class="pval g" id="p1v">3s</span>
    </div>
    <div class="pslot">
      <span class="plbl">Naeste</span>
      <input type="range" id="p2r" min="1" max="12" value="4"
             oninput="PAUSE2=+this.value;G('p2v').textContent=this.value+'s'">
      <span class="pval p" id="p2v">4s</span>
    </div>
  </div>
</div>

<script>
var TS="1778012465",LANG="da",SPEEDS=[0.8,1.0,1.2,1.5],spdI=1,PAUSE1=3,PAUSE2=4;
var SRS_BASE=7,SRS_FACTOR=2.0,SRS_REPS=3,SRS_JITTER=2;
var META=[],CACHE={},sel=new Set(),queue=[],qIdx=0,curItem=null,playing=false;
var seqTmr=null,ttsSafe=null;
var RV_VOICES={da:"Danish Female",en:"UK English Female"};
var LBL={da:{spg:"Spoergsmaal",ctx:"Kontekst",essens:"Essens",ref:"Refleksionsspoergsmaal",udd:"Uddybning",svar:"Svar paa refleksion",src:"Kilde"},en:{spg:"Question",ctx:"Context",essens:"Essence",ref:"Reflection question",udd:"Elaboration",svar:"Answer",src:"Source"}};

function G(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}

// Hent decks
fetch("./decks.json?v="+TS)
  .then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
  .then(d=>{
    META=d.decks||[];
    var tot=META.reduce((a,x)=>a+x.n,0);
    G("pdot").style.background="var(--g)";
    G("ptxt").textContent=tot+" kort — Google TTS";
    renderDecks();
    preload();
  }).catch(e=>{
    G("pdot").style.background="var(--r)";
    G("ptxt").textContent="Fejl: koer sync.py";
  });

function preload(){
  var i=0;
  (function nx(){
    if(i>=META.length)return;
    var did=META[i++].id;
    if(CACHE[did]){nx();return;}
    fetch("./cards/"+did+".json?v="+TS)
      .then(r=>r.json())
      .then(raw=>{CACHE[did]=raw.map(expand);setTimeout(nx,70);})
      .catch(()=>setTimeout(nx,300));
  })();
}
function expand(c){return{spg:c[0],ctx:c[1],essens:c[2],ref:c[3],udd:c[4],svar:c[5],src:c[6]};}
function fetchDeck(did){
  if(CACHE[did])return Promise.resolve(CACHE[did]);
  return fetch("./cards/"+did+".json?v="+TS).then(r=>r.json()).then(raw=>{CACHE[did]=raw.map(expand);return CACHE[did];});
}

function renderDecks(){
  var sec=G("deckSec");sec.innerHTML="";
  var groups={},order=[];
  META.forEach(d=>{var g=d.folder||d.cat;if(!groups[g]){groups[g]=[];order.push(g);}groups[g].push(d);});
  order.forEach(g=>{
    var decks=groups[g];
    var lbl=document.createElement("div");lbl.className="sec-h";lbl.textContent=decks[0].folderLabel||g;sec.appendChild(lbl);
    decks.forEach(d=>{
      var div=document.createElement("div");div.className="dk";div.id="dk_"+d.id;
      div.innerHTML=`<div class="dk-ico">${d.icon}</div><div class="dk-info"><div class="dk-name">${esc(d.name)}</div><div class="dk-cnt">${d.n} kort</div></div><div class="dk-chk"><div class="tick"></div></div>`;
      div.addEventListener("click",()=>toggleDeck(d.id));
      sec.appendChild(div);
    });
  });
}

function toggleDeck(did){if(sel.has(did))sel.delete(did);else sel.add(did);G("dk_"+did).classList.toggle("on",sel.has(did));updateBar();}
function updateBar(){
  var n=sel.size;G("bar").classList.toggle("show",n>0);
  var tot=0;sel.forEach(did=>{var d=findM(did);if(d)tot+=d.n;});
  G("bInfo").innerHTML="<strong>"+n+" deck"+(n>1?"s":"")+"</strong> &middot; "+tot+" kort";
}
function clearSel(){sel.forEach(did=>G("dk_"+did).classList.remove("on"));sel.clear();updateBar();}
function setLang(l){LANG=l;G("bDA").classList.toggle("on",l==="da");G("bEN").classList.toggle("on",l==="en");}
function findM(did){return META.find(x=>x.id===did)||null;}
function nextSpd(){spdI=(spdI+1)%SPEEDS.length;G("spdBtn").textContent=SPEEDS[spdI].toFixed(1)+"x";G("spdBtn").classList.toggle("hi",spdI!==1);}
function updateCtr(){G("pctr").textContent=qIdx+"/"+queue.length;}

// SRS
function srsIv(p){return Math.round(SRS_BASE*Math.pow(SRS_FACTOR,p));}
function buildQ(cards){var a=cards.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}queue=a.map(c=>({card:c,pass:0}));qIdx=0;}
function schedRep(item){if(item.pass>=SRS_REPS)return;var iv=srsIv(item.pass);var jit=Math.floor(Math.random()*(SRS_JITTER*2+1))-SRS_JITTER;var pos=Math.max(qIdx+1,Math.min(qIdx+iv+jit,queue.length));queue.splice(pos,0,{card:item.card,pass:item.pass+1});}

function startPlay(){
  var ids=Array.from(sel);if(!ids.length)return;
  var btn=G("goBtn");
  if(ids.some(id=>!CACHE[id])){btn.textContent="Indlaeder...";btn.disabled=true;}
  Promise.all(ids.map(id=>fetchDeck(id).catch(()=>[]))).then(results=>{
    btn.textContent="Afspil";btn.disabled=false;
    var all=[];
    ids.forEach((id,i)=>{var d=findM(id);if(d)results[i].forEach(c=>all.push(Object.assign({},c,{_d:d.name})));});
    if(!all.length)return;
    buildQ(all);playing=false;
    G("pgHome").classList.remove("on");G("pgPlay").classList.add("on");
    G("ptitle").textContent=ids.length===1?(findM(ids[0])||{name:""}).name:"Blandet "+ids.length+" decks";
    G("idleH").textContent="Klar til afspilning";
    G("idleChips").innerHTML=ids.map(id=>{var d=findM(id);return d?`<span style="font-size:10px;padding:3px 9px;border-radius:99px;background:var(--s);border:1px solid var(--b);color:var(--m)">${d.icon} ${esc(d.name)}</span>`:""}).join("");
    G("idleV").style.display="flex";G("cardV").style.display="none";G("spkbar").style.display="none";
    G("mainBtn").textContent="Afspil";updateCtr();
  });
}

function goHome(){playing=false;stopAll();G("pgPlay").classList.remove("on");G("pgHome").classList.add("on");}
function togglePlay(){
  if(playing){playing=false;stopAll();G("mainBtn").textContent="Fortsaet";G("spkbar").style.display="none";}
  else{
    if(qIdx>=queue.length){var seen={},c=[];queue.forEach(it=>{if(!seen[it.card.spg]){seen[it.card.spg]=1;c.push(it.card);}});buildQ(c);}
    playing=true;G("mainBtn").textContent="Pause";
    G("idleV").style.display="none";G("cardV").style.display="flex";
    showCard();
  }
}
function doSkip(){stopAll();if(!playing)return;if(curItem){schedRep(curItem);qIdx++;}updateCtr();showCard();}

function showCard(){
  if(!playing)return;
  if(qIdx>=queue.length){
    playing=false;stopAll();
    G("mainBtn").textContent="Start forfra";
    G("cardV").style.display="none";G("spkbar").style.display="none";
    G("idleV").style.display="flex";G("idleH").textContent="Session faerdig!";
    return;
  }
  curItem=queue[qIdx];updateCtr();
  var c=curItem.card,p=curItem.pass;
  var rC=["r0","r1","r2","r3"][Math.min(p,3)];
  var rL=["Nyt","Gensyn 1","Gensyn 2","Gensyn 3"][Math.min(p,3)];
  G("rBadge").className="rep "+rC;G("rBadge").textContent=rL;

  // Saet alle felter paa een gang — ingen hop i teksten
  G("vQ").textContent=c.spg;G("vC").textContent=c.ctx;
  G("vE").textContent=c.essens;G("vR").textContent=c.ref;
  G("vU").textContent=c.udd;G("vS").textContent=c.svar;
  G("vK").textContent=(c._d?c._d+" — ":"")+c.src;

  // Dim svar-felter
  ["fE","fR","fU","fS","fK"].forEach(id=>{G(id).className="field ans";});
  unlitAll();G("pcontent").scrollTop=0;

  var L=LBL[LANG];
  var steps=[
    {t:L.spg+": "+c.spg,   lid:"lQ"},
    {t:L.ctx+": "+c.ctx,   lid:"lC"},
    {pauseFn:()=>PAUSE1*1000, fn:()=>["fE","fR","fU","fS","fK"].forEach(id=>G(id).classList.add("show"))},
    {t:L.essens+": "+c.essens, lid:"lE", skip:!c.essens},
    {t:L.ref+": "+c.ref,       lid:"lR", skip:!c.ref},
    {t:L.udd+": "+c.udd,       lid:"lU", skip:!c.udd},
    {t:L.svar+": "+c.svar,     lid:"lS", skip:!c.svar},
    {t:L.src+": "+(c._d?c._d+". ":"")+c.src, lid:"lK"},
    {pauseFn:()=>PAUSE2*1000, fn:()=>{schedRep(curItem);qIdx++;updateCtr();showCard();}}
  ];
  runSeq(steps,0);
}

function runSeq(steps,i){
  if(!playing||i>=steps.length)return;
  var st=steps[i];
  if(st.skip){runSeq(steps,i+1);return;}
  if(st.pauseFn){
    if(st.fn)st.fn();
    unlitAll();G("spkbar").style.display="none";
    seqTmr=setTimeout(()=>runSeq(steps,i+1),st.pauseFn());
    return;
  }
  litLabel(st.lid);
  G("spkbar").style.display="flex";
  G("spktxt").textContent=st.t.substring(0,58)+(st.t.length>58?"...":"");
  tts(st.t,()=>runSeq(steps,i+1));
}

// TTS via ResponsiveVoice (Google TTS)
function tts(text,onDone){
  if(!playing)return;
  if(!text||!text.trim()){if(playing&&onDone)seqTmr=setTimeout(onDone,80);return;}
  if(ttsSafe){clearTimeout(ttsSafe);ttsSafe=null;}
  var spd=SPEEDS[spdI];
  var words=text.trim().split(/\s+/).length;
  var estMs=Math.max(900,(words/(130*spd))*60000);
  var dc=false;
  function done(){if(dc)return;dc=true;if(ttsSafe){clearTimeout(ttsSafe);ttsSafe=null;}if(playing&&onDone)seqTmr=setTimeout(onDone,150);}
  if(typeof responsiveVoice!=="undefined"&&responsiveVoice.voiceSupport()){
    responsiveVoice.speak(text,RV_VOICES[LANG],{rate:spd,pitch:1.0,volume:1.0,onend:done,onerror:done});
  } else {
    // Fallback: Web Speech API
    if(!window.speechSynthesis){setTimeout(done,500);return;}
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.rate=spd;u.lang=LANG==="da"?"da-DK":"en-GB";
    u.onend=done;u.onerror=done;
    window.speechSynthesis.speak(u);
  }
  ttsSafe=setTimeout(()=>{if(typeof responsiveVoice!=="undefined")responsiveVoice.cancel();done();},estMs*2.5+5000);
}

function stopAll(){
  if(seqTmr){clearTimeout(seqTmr);seqTmr=null;}
  if(ttsSafe){clearTimeout(ttsSafe);ttsSafe=null;}
  if(typeof responsiveVoice!=="undefined")responsiveVoice.cancel();
  if(window.speechSynthesis)window.speechSynthesis.cancel();
}

function unlitAll(){document.querySelectorAll(".fl").forEach(l=>l.classList.remove("lit"));}
function litLabel(id){unlitAll();if(id&&G(id))G(id).classList.add("lit");}

// PWA Service Worker
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
