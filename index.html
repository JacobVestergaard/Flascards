<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flashcards">
<meta name="theme-color" content="#0a0a0a">
<title>Flashcards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0a0a;--s:#141414;--b:#222;--t:#f0f0f0;--m:#777;--mm:#444;--g:#4ade80;--p:#818cf8;--y:#fbbf24;--r:#f87171}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--t)}
.pg{display:none;flex-direction:column;height:100%}.pg.on{display:flex}
.hdr{padding:52px 20px 12px;padding-top:max(52px,calc(env(safe-area-inset-top)+16px));flex-shrink:0}
.logo{font-size:27px;font-weight:800;letter-spacing:-.5px}
.sub{font-size:13px;color:var(--m);margin-top:2px}
.pill{display:flex;align-items:center;gap:7px;margin-top:10px;padding:9px 12px;background:var(--s);border:1px solid var(--b);border-radius:10px;font-size:12px;color:var(--m)}
.sdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.lngs{display:flex;gap:6px;margin-top:9px}
.lb{padding:7px 16px;border-radius:99px;border:1px solid var(--b);background:var(--s);color:var(--m);font-size:13px;font-family:inherit;cursor:pointer}
.lb.on{background:#0c1f0c;color:var(--g);border-color:#1d3d1d;font-weight:600}
.body{flex:1;overflow-y:auto;padding:6px 20px 120px;-webkit-overflow-scrolling:touch}
.sec-lbl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mm);margin:16px 0 6px 2px}
.dk{display:flex;align-items:center;gap:11px;padding:12px;background:var(--s);border:1px solid var(--b);border-radius:12px;margin-bottom:6px;cursor:pointer;user-select:none}
.dk.on{background:#0c1f0c;border-color:#2d4d2d}
.dk-icon{width:36px;height:36px;border-radius:8px;background:#1e1e1e;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.dk-info{flex:1;min-width:0}
.dk-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dk-cnt{font-size:11px;color:var(--m);margin-top:1px}
.dk-chk{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--b);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.dk.on .dk-chk{background:var(--g);border-color:var(--g)}
.tick{display:none}.dk.on .tick{display:block;width:5px;height:9px;border:2px solid #000;border-top:none;border-left:none;transform:rotate(45deg);margin-top:-1px}
.bar{position:fixed;bottom:0;left:0;right:0;padding:10px 16px;padding-bottom:max(16px,calc(env(safe-area-inset-bottom)+10px));background:rgba(10,10,10,.96);border-top:1px solid var(--b);backdrop-filter:blur(16px);display:flex;gap:8px;align-items:center;transform:translateY(100%);transition:transform .22s}
.bar.show{transform:none}
.bar-info{flex:1;font-size:12px;color:var(--m)}.bar-info strong{color:var(--t);font-size:13px}
.btn-ghost{padding:11px 13px;background:var(--s);border:1px solid var(--b);border-radius:10px;color:var(--m);font-size:13px;font-family:inherit;cursor:pointer}
.btn-go{padding:11px 24px;background:var(--g);border:none;border-radius:10px;color:#000;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer}
.top{display:flex;align-items:center;padding:10px 16px;padding-top:max(10px,calc(env(safe-area-inset-top)+4px));border-bottom:1px solid var(--b);gap:8px;flex-shrink:0;min-height:48px}
.back{background:none;border:none;color:var(--m);font-size:14px;cursor:pointer;font-family:inherit;padding:4px 0}
.pl-title{flex:1;text-align:center;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.pl-ctr{font-size:12px;color:var(--m);white-space:nowrap}
.content{flex:1;overflow-y:auto;padding:14px 20px 16px;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column}
.badge{align-self:flex-start;font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:3px 10px;border-radius:99px;margin-bottom:10px}
.bq{background:#0c1f0c;color:var(--g);border:1px solid #1d3d1d}
.ba{background:#0d0d20;color:var(--p);border:1px solid #1a1a38}
.bp{background:var(--s);color:var(--mm);border:1px solid var(--b)}
.row{padding:8px 0;border-bottom:1px solid #1a1a1a}.row:last-child{border-bottom:none}
.lbl{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mm);margin-bottom:3px;transition:color .15s}
.lbl.lit{color:var(--y)}
.val{font-size:14px;line-height:1.72}
.val.dim{color:var(--m);font-size:13px;font-style:italic}
.val.bold{font-weight:600;font-size:15px;color:#fff}
.val.blue{color:var(--p);font-size:13px;line-height:1.65}
.rep{display:inline-block;font-size:9px;padding:2px 7px;border-radius:99px;margin-left:5px;vertical-align:middle}
.rep.new{background:#0c1f0c;color:var(--g);border:1px solid #1d3d1d}
.rep.r1{background:#0d0d20;color:var(--p);border:1px solid #1a1a38}
.rep.r2{background:#1a100c;color:var(--y);border:1px solid #3d2d1d}
.rep.r3{background:#1a0c0c;color:var(--r);border:1px solid #3d1d1d}
.idle{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:32px}
.idle-icon{font-size:42px}.idle-h{font-size:18px;font-weight:600}
.idle-s{font-size:12px;color:var(--m);line-height:1.65;max-width:260px}
.tags{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:4px}
.tag{font-size:10px;padding:3px 9px;border-radius:99px;background:var(--s);border:1px solid var(--b);color:var(--m)}
.tts-tag{font-size:10px;padding:3px 9px;border-radius:99px;background:#0c1f0c;border:1px solid #1d3d1d;color:var(--g)}
.spkbar{padding:8px 16px;background:#0a150a;border-top:1px solid #1a3a1a;display:flex;align-items:center;gap:8px;min-height:36px;flex-shrink:0}
.spkdot{width:6px;height:6px;border-radius:50%;background:var(--g);animation:blink 1.3s infinite;flex-shrink:0}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
.spktxt{font-size:11px;color:var(--g);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog{width:60px;height:2px;background:#1a3a1a;border-radius:2px;overflow:hidden;flex-shrink:0}
.progfill{height:100%;background:var(--g);width:0%}
.ctrl{padding:10px 16px;padding-bottom:max(16px,calc(env(safe-area-inset-bottom)+10px));border-top:1px solid var(--b);display:flex;gap:7px;align-items:center;flex-shrink:0}
.sp-btn{padding:12px 14px;background:var(--s);border:1px solid var(--b);border-radius:10px;color:var(--m);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;min-width:58px;text-align:center}
.sp-btn.hi{color:var(--y);border-color:#3d2d1d;background:#1a100c}
.play-btn{flex:1;padding:12px;background:#fff;color:#000;border:none;border-radius:10px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer}
.skip-btn{padding:12px 14px;background:var(--s);border:1px solid var(--b);border-radius:10px;color:var(--m);font-size:14px;font-family:inherit;cursor:pointer}
</style>
</head>
<body>

<div class="pg on" id="pgHome">
  <div class="hdr">
    <div class="logo">Flashcards</div>
    <div class="sub">Vaelg decks og tryk Afspil</div>
    <div class="pill">
      <div class="sdot" id="sDot" style="background:var(--y)"></div>
      <span id="sTxt">Indlaeder...</span>
    </div>
    <div class="lngs">
      <button class="lb on" id="btnDA" onclick="setLang('da')">Dansk</button>
      <button class="lb"    id="btnEN" onclick="setLang('en')">English</button>
    </div>
  </div>
  <div class="body" id="deckSections"></div>
  <div class="bar" id="bar">
    <div class="bar-info" id="barInfo"></div>
    <button class="btn-ghost" onclick="clearSel()">Ryd</button>
    <button class="btn-go" id="btnPlay" onclick="startPlay()">Afspil</button>
  </div>
</div>

<div class="pg" id="pgPlay">
  <div class="top">
    <button class="back" onclick="goHome()">Tilbage</button>
    <div class="pl-title" id="plTitle"></div>
    <div class="pl-ctr" id="plCtr">0/0</div>
  </div>
  <div class="content" id="plContent">
    <div class="idle" id="idleView">
      <div class="idle-icon">&#9654;</div>
      <div class="idle-h" id="idleH">Klar til afspilning</div>
      <div class="idle-s">Hvert kort laeses op 4 gange med stigende interval</div>
      <div class="tags" id="idleTags"></div>
      <div class="tts-tag" id="ttsTag">Google TTS</div>
    </div>
    <div id="cardView" style="display:none">
      <div class="badge bp" id="cBadge">...</div>
      <div class="row"><div class="lbl" id="lQ">Spoergsmaal</div><div class="val" id="vQ"></div></div>
      <div class="row"><div class="lbl" id="lC">Kontekst</div><div class="val dim" id="vC"></div></div>
      <div class="row" id="rE" style="display:none"><div class="lbl" id="lE">Essens</div><div class="val bold" id="vE"></div></div>
      <div class="row" id="rR" style="display:none"><div class="lbl" id="lR">Refleksion</div><div class="val blue" id="vR"></div></div>
      <div class="row" id="rU" style="display:none"><div class="lbl" id="lU">Uddybning</div><div class="val" id="vU"></div></div>
      <div class="row" id="rS" style="display:none"><div class="lbl" id="lS">Svar</div><div class="val blue" id="vS"></div></div>
      <div class="row" id="rK" style="display:none"><div class="lbl" id="lK">Kilde</div><div class="val dim" id="vK"></div></div>
    </div>
  </div>
  <div class="spkbar" id="spkbar" style="display:none">
    <div class="spkdot"></div>
    <div class="spktxt" id="spktxt">...</div>
    <div class="prog"><div class="progfill" id="progfill"></div></div>
  </div>
  <div class="ctrl">
    <button class="sp-btn" id="spdBtn" onclick="nextSpd()">1.0x</button>
    <button class="play-btn" id="mainBtn" onclick="togglePlay()">Afspil</button>
    <button class="skip-btn" onclick="skipCard()">Skip</button>
  </div>
</div>

<script>
var TS="1777975506";
var LANG="da";
var VOICES={da:"Danish Female",en:"UK English Female"};
var SPEEDS=[0.8,1.0,1.2,1.5];
var spdI=1;
var SRS_BASE=7,SRS_FACTOR=2.0,SRS_REPS=3,SRS_JITTER=2;
var META=[],CACHE={},sel=new Set();
var queue=[],qIdx=0,curItem=null,playing=false,seqTmr=null;
var rvOK=false;

// Indlaes ResponsiveVoice
(function(){
  var s=document.createElement("script");
  s.src="https://code.responsivevoice.org/responsivevoice.js?key=FREE";
  s.onload=function(){
    if(typeof responsiveVoice!=="undefined"){
      responsiveVoice.init();
      // Test om dansk stemme virker
      rvOK=true;
    }
  };
  document.head.appendChild(s);
})();

function G(id){return document.getElementById(id);}
function show(id){G(id).style.display="block";}
function hide(id){G(id).style.display="none";}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

// Indlaes decks
fetch("./decks.json?v="+TS)
  .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
  .then(function(d){
    META=d.decks||[];
    var tot=META.reduce(function(a,x){return a+x.n;},0);
    G("sDot").style.background="var(--g)";
    G("sTxt").textContent=tot+" kort klar";
    renderDecks();
    preloadAll();
  })
  .catch(function(e){
    G("sDot").style.background="var(--r)";
    G("sTxt").textContent="Fejl: koer sync.py ("+e.message+")";
  });

function preloadAll(){
  var i=0;
  (function next(){
    if(i>=META.length)return;
    var did=META[i++].id;
    if(CACHE[did]){next();return;}
    fetch("./cards/"+did+".json?v="+TS)
      .then(function(r){return r.json();})
      .then(function(raw){CACHE[did]=raw.map(expand);setTimeout(next,70);})
      .catch(function(){setTimeout(next,300);});
  })();
}
function expand(c){return{spg:c[0],ctx:c[1],essens:c[2],ref:c[3],udd:c[4],svar:c[5],src:c[6]};}
function fetchDeck(did){
  if(CACHE[did])return Promise.resolve(CACHE[did]);
  return fetch("./cards/"+did+".json?v="+TS).then(function(r){return r.json();}).then(function(raw){CACHE[did]=raw.map(expand);return CACHE[did];});
}

function renderDecks(){
  var sec=G("deckSections");sec.innerHTML="";
  var groups={},order=[];
  META.forEach(function(d){
    var g=d.folder||d.cat;
    if(!groups[g]){groups[g]=[];order.push(g);}
    groups[g].push(d);
  });
  if(!order.length){sec.innerHTML='<div style="padding:20px;color:var(--m);font-size:13px">Ingen decks fundet \u2014 koer sync.py</div>';return;}
  order.forEach(function(g){
    var decks=groups[g];
    var lbl=document.createElement("div");lbl.className="sec-lbl";lbl.textContent=decks[0].folderLabel||g;sec.appendChild(lbl);
    decks.forEach(function(d){
      var div=document.createElement("div");div.className="dk";div.id="dk_"+d.id;
      div.innerHTML='<div class="dk-icon">'+d.icon+'</div><div class="dk-info"><div class="dk-name">'+esc(d.name)+'</div><div class="dk-cnt">'+d.n+' kort</div></div><div class="dk-chk"><div class="tick"></div></div>';
      div.addEventListener("click",function(){toggleDeck(d.id);});
      sec.appendChild(div);
    });
  });
}

function toggleDeck(did){if(sel.has(did))sel.delete(did);else sel.add(did);G("dk_"+did).classList.toggle("on",sel.has(did));updateBar();}
function updateBar(){
  var n=sel.size;G("bar").classList.toggle("show",n>0);
  var tot=0;sel.forEach(function(did){var d=findM(did);if(d)tot+=d.n;});
  G("barInfo").innerHTML="<strong>"+n+" deck"+(n>1?"s":"")+"</strong> &middot; "+tot+" kort";
}
function clearSel(){sel.forEach(function(did){G("dk_"+did).classList.remove("on");});sel.clear();updateBar();}
function setLang(l){
  LANG=l;G("btnDA").classList.toggle("on",l==="da");G("btnEN").classList.toggle("on",l==="en");
  G("ttsTag").textContent="Google TTS \u2014 "+(l==="da"?"Dansk stemme":"English voice");
}
function findM(did){for(var i=0;i<META.length;i++)if(META[i].id===did)return META[i];return null;}

// SRS
function srsIv(pass){return Math.round(SRS_BASE*Math.pow(SRS_FACTOR,pass));}
function buildQ(cards){
  var arr=cards.slice();
  for(var i=arr.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}
  queue=arr.map(function(c){return{card:c,pass:0};});qIdx=0;
}
function schedRep(item){
  if(item.pass>=SRS_REPS)return;
  var iv=srsIv(item.pass);
  var jit=Math.floor(Math.random()*(SRS_JITTER*2+1))-SRS_JITTER;
  var pos=Math.max(qIdx+1,Math.min(qIdx+iv+jit,queue.length));
  queue.splice(pos,0,{card:item.card,pass:item.pass+1});
}

function startPlay(){
  var ids=Array.from(sel);if(!ids.length)return;
  var btn=G("btnPlay");
  if(ids.filter(function(id){return!CACHE[id];}).length){btn.textContent="Indlaeder...";btn.disabled=true;}
  Promise.all(ids.map(function(did){return fetchDeck(did).catch(function(){return[];});}))
    .then(function(results){
      btn.textContent="Afspil";btn.disabled=false;
      var all=[];
      ids.forEach(function(did,i){
        var d=findM(did);
        if(d)results[i].forEach(function(c){all.push(Object.assign({},c,{_d:d.name,_icon:d.icon}));});
      });
      if(!all.length)return;
      buildQ(all);playing=false;
      G("pgHome").classList.remove("on");G("pgPlay").classList.add("on");
      G("plTitle").textContent=ids.length===1?(findM(ids[0])||{name:""}).name:"Blandet \u00b7 "+ids.length+" decks";
      G("idleH").textContent="Klar til afspilning";
      G("idleTags").innerHTML=ids.map(function(did){var d=findM(did);return d?'<span class="tag">'+d.icon+" "+esc(d.name)+"</span>":"";}).join("");
      G("ttsTag").textContent="Google TTS \u2014 "+(LANG==="da"?"Dansk stemme":"English voice");
      G("idleView").style.display="flex";hide("cardView");hide("spkbar");
      G("mainBtn").textContent="Afspil";
      updateCtr();
    });
}

function goHome(){playing=false;stopAll();G("pgPlay").classList.remove("on");G("pgHome").classList.add("on");}

function togglePlay(){
  if(playing){
    playing=false;stopAll();G("mainBtn").textContent="Fortsaet";hide("spkbar");
  }else{
    if(qIdx>=queue.length){
      var orig={};var cards=[];
      queue.forEach(function(it){if(!orig[it.card.spg]){orig[it.card.spg]=true;cards.push(it.card);}});
      buildQ(cards);
    }
    playing=true;G("mainBtn").textContent="Pause";
    G("idleView").style.display="none";show("cardView");
    showCard();
  }
}

function skipCard(){
  stopAll();if(!playing)return;
  if(curItem){schedRep(curItem);qIdx++;}
  updateCtr();showCard();
}

function nextSpd(){
  spdI=(spdI+1)%SPEEDS.length;
  G("spdBtn").textContent=SPEEDS[spdI].toFixed(1)+"x";
  G("spdBtn").classList.toggle("hi",spdI!==1);
}

function updateCtr(){G("plCtr").textContent=qIdx+"/"+queue.length;}

function showCard(){
  if(!playing)return;
  if(qIdx>=queue.length){
    playing=false;stopAll();
    G("mainBtn").textContent="Start forfra";
    hide("cardView");hide("spkbar");
    G("idleView").style.display="flex";
    G("idleH").textContent="Session faerdig!";
    return;
  }
  curItem=queue[qIdx];updateCtr();
  var c=curItem.card,pass=curItem.pass;
  var rC=["new","r1","r2","r3"][Math.min(pass,3)];
  var rL=["Nyt","Gensyn 1","Gensyn 2","Gensyn 3"][Math.min(pass,3)];
  G("vQ").innerHTML=esc(c.spg)+' <span class="rep '+rC+'">'+rL+"</span>";
  G("vC").textContent=c.ctx;G("vE").textContent=c.essens;G("vR").textContent=c.ref;
  G("vU").textContent=c.udd;G("vS").textContent=c.svar;
  G("vK").textContent=(c._d?c._d+" \u2014 ":"")+c.src;
  ["rE","rR","rU","rS","rK"].forEach(function(id){hide(id);});
  unlit();setBadge("q");G("plContent").scrollTop=0;

  // Komplet sekvens — laes ALT der vises paa siden
  runSeq([
    {text:"Spoergsmaal: "+c.spg,    lid:"lQ"},
    {text:"Kontekst: "+c.ctx,       lid:"lC"},
    {wait:3000,fn:function(){setBadge("a");}},
    {text:c.essens,                 lid:"lE",show:"rE"},
    {text:"Refleksion: "+c.ref,     lid:"lR",show:"rR"},
    {text:c.udd,                    lid:"lU",show:"rU",scroll:"rU"},
    {text:"Svar: "+c.svar,          lid:"lS",show:"rS",scroll:"rS"},
    {text:"Kilde: "+c.src,          lid:"lK",show:"rK"},
    {wait:3500,fn:function(){schedRep(curItem);qIdx++;updateCtr();showCard();}}
  ],0);
}

function runSeq(steps,i){
  if(!playing||i>=steps.length)return;
  var st=steps[i];
  if(st.show)show(st.show);
  if(st.scroll)G(st.scroll).scrollIntoView({behavior:"smooth",block:"nearest"});
  if(st.wait!==undefined){
    if(st.fn)st.fn();
    unlit();hide("spkbar");
    seqTmr=setTimeout(function(){runSeq(steps,i+1);},st.wait);
    return;
  }
  lit(st.lid);
  tts(st.text,function(){runSeq(steps,i+1);});
}

// TTS — Google TTS via ResponsiveVoice, fallback til browser
function tts(text,onDone){
  if(!playing)return;
  var spd=SPEEDS[spdI];
  var ms=Math.max(900,(text.trim().split(/\s+/).length/(130*spd))*60000);
  G("spkbar").style.display="flex";
  G("spktxt").textContent=text.substring(0,55)+(text.length>55?"...":"");
  startProg(ms);
  var done=once(function(){stopProg();if(playing&&onDone)seqTmr=setTimeout(onDone,120);});

  if(rvOK&&typeof responsiveVoice!=="undefined"){
    try{
      responsiveVoice.speak(text,VOICES[LANG],{
        rate:spd,pitch:1.0,volume:1.0,
        onend:done,
        onerror:function(){
          // Fallback til browser TTS
          bTTS(text,spd,done);
        }
      });
      return;
    }catch(e){/* fald igennem til browser */}
  }
  bTTS(text,spd,done);
}

function bTTS(text,spd,done){
  if(!window.speechSynthesis){setTimeout(done,1000);return;}
  window.speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text);
  u.lang=LANG==="da"?"da-DK":"en-GB";u.rate=spd;u.pitch=1.0;
  u.onend=done;u.onerror=done;
  window.speechSynthesis.speak(u);
}

function once(fn){var c=false;return function(){if(!c){c=true;fn();}};}

function stopAll(){
  if(seqTmr){clearTimeout(seqTmr);seqTmr=null;}
  if(rvOK&&typeof responsiveVoice!=="undefined"){try{responsiveVoice.cancel();}catch(e){}}
  if(window.speechSynthesis){try{window.speechSynthesis.cancel();}catch(e){}}
  stopProg();
}

var pTmr=null;
function startProg(ms){
  var f=G("progfill");f.style.transition="none";f.style.width="0%";
  if(pTmr)clearTimeout(pTmr);
  pTmr=setTimeout(function(){f.style.transition="width "+ms+"ms linear";f.style.width="100%";},30);
}
function stopProg(){
  if(pTmr){clearTimeout(pTmr);pTmr=null;}
  var f=G("progfill");f.style.transition="none";f.style.width="0%";
}

function lit(id){
  document.querySelectorAll(".lbl").forEach(function(l){l.classList.remove("lit");});
  if(id&&G(id))G(id).classList.add("lit");
}
function unlit(){document.querySelectorAll(".lbl").forEach(function(l){l.classList.remove("lit");});}
function setBadge(ph){
  var b=G("cBadge");
  if(ph==="q"){b.className="badge bq";b.textContent="Spoergsmaal";}
  else if(ph==="a"){b.className="badge ba";b.textContent="Svar";}
  else{b.className="badge bp";b.textContent="...";}
}
</script>
